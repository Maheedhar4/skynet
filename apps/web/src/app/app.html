<header class="topbar">
  <div class="brand">
    <span class="mark">⌁</span> skynet
  </div>
  <div class="header-right">
    @for (c of cs.connectors(); track c.id) {
      <span
        class="status-dot"
        [title]="c.name + ' · ' + (c.status.state)"
        [style.background]="dotFor(c.id)"
      ></span>
    }
    <button class="connect-btn" (click)="cs.sheetOpen.set(true)">
      Connect to Quick Commerce MCPs
    </button>
  </div>
</header>

<main>
  <sk-chat />
</main>

@if (cs.sheetOpen()) {
  <sk-connector-sheet />
}

@if (cs.toast(); as toast) {
  <div class="toast">{{ toast }}</div>
}
